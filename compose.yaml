services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: storeflow
      POSTGRES_PASSWORD: storeflow
      POSTGRES_DB: storeflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storeflow -d storeflow"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: